<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860.0 300" width="860.0" role="img" aria-label="A page of 2600 characters is cut into three chunks of 1000 characters. Each chunk starts 800 characters after the previous one, so neighbouring chunks share 200 characters.">
<title>A page of 2600 characters is cut into three chunks of 1000 characters. Each chunk starts 800 characters after the previous one, so neighbouring chunks share 200 characters.</title>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.title { font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; fill: #5f6b7a; }
.lane { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #5f6b7a; }
.label { font-size: 12px; fill: #5f6b7a; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="1" y="1" width="858.0" height="298" rx="14" fill="#ffffff" stroke="#e1e5ea"/>
<text class="lane" x="40" y="36" text-anchor="start">ONE PAGE OF TEXT · 2,600 CHARACTERS</text>
<rect x="280.0" y="48" width="60.0" height="164" fill="#d9822b" opacity=".14"/>
<text class="label" x="310.0" y="236" text-anchor="middle">200 shared</text>
<rect x="520.0" y="48" width="60.0" height="164" fill="#d9822b" opacity=".14"/>
<text class="label" x="550.0" y="236" text-anchor="middle">200 shared</text>
<rect x="40.0" y="52" width="780.0" height="26" rx="4" fill="#eef1f4" stroke="#c5ccd3"/>
<rect x="40.0" y="96" width="300.0" height="28" rx="5" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="label" x="190.0" y="115" text-anchor="middle" style="fill:#1f2933">chunk 1 · characters 0–1000</text>
<rect x="280.0" y="134" width="300.0" height="28" rx="5" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="label" x="430.0" y="153" text-anchor="middle" style="fill:#1f2933">chunk 2 · characters 800–1800</text>
<rect x="520.0" y="172" width="300.0" height="28" rx="5" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="label" x="670.0" y="191" text-anchor="middle" style="fill:#1f2933">chunk 3 · characters 1600–2600</text>
<path d="M40.0,262 L278.0,262" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="label" x="160.0" y="280" text-anchor="middle">next chunk starts 800 later (size 1000 − overlap 200)</text>
</svg>

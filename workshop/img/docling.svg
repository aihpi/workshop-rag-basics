<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 344" width="820" role="img" aria-label="Docling recognises the parts of a PDF page (heading, paragraph, table, figure) and turns them into Markdown, keeping the heading as ## and the table as a Markdown table.">
<title>Docling recognises the parts of a PDF page (heading, paragraph, table, figure) and turns them into Markdown, keeping the heading as ## and the table as a Markdown table.</title>
<style>

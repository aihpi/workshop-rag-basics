<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 336" width="860" role="img" aria-label="A Qdrant collection called papers holds one point per chunk. Each point has an id, a vector that Qdrant searches by, and a payload with file, page and text that comes back with the results. A question vector goes in, the 5 closest points come out.">
<title>A Qdrant collection called papers holds one point per chunk. Each point has an id, a vector that Qdrant searches by, and a payload with file, page and text that comes back with the results. A question vector goes in, the 5 closest points come out.</title>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.title { font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; fill: #5f6b7a; }
.lane { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #5f6b7a; }
.label { font-size: 12px; fill: #5f6b7a; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="1" y="1" width="858" height="334" rx="14" fill="#ffffff" stroke="#e1e5ea"/>
<rect x="24" y="24" width="540" height="258" rx="12" fill="#e6f6ec" stroke="#2f9e62" stroke-width="1.5"/>
<text class="title" x="42" y="50" text-anchor="start">Collection “papers”</text>
<text class="lane" x="42" y="80" text-anchor="start">id</text>
<text class="lane" x="96" y="80" text-anchor="start">VECTOR</text>
<text class="lane" x="316" y="80" text-anchor="start">PAYLOAD</text>
<rect x="38" y="92" width="512" height="42" rx="6" fill="#ffffff" stroke="#2f9e62" stroke-width="1"/>
<text class="mono" x="48" y="118" text-anchor="start" xml:space="preserve">0</text>
<text class="mono" x="96" y="118" text-anchor="start" xml:space="preserve">[0.012, -0.031, 0.087, …]</text>
<text class="mono" x="316" y="118" text-anchor="start" xml:space="preserve">Kage_2018 · p. 1 · “Time-res…”</text>
<rect x="38" y="144" width="512" height="42" rx="6" fill="#ffffff" stroke="#2f9e62" stroke-width="1"/>
<text class="mono" x="48" y="170" text-anchor="start" xml:space="preserve">1</text>
<text class="mono" x="96" y="170" text-anchor="start" xml:space="preserve">[-0.007, 0.044, 0.019, …]</text>
<text class="mono" x="316" y="170" text-anchor="start" xml:space="preserve">Kage_2018 · p. 1 · “multiplex…”</text>
<rect x="38" y="196" width="512" height="42" rx="6" fill="#ffffff" stroke="#2f9e62" stroke-width="1"/>
<text class="mono" x="48" y="222" text-anchor="start" xml:space="preserve">2</text>
<text class="mono" x="96" y="222" text-anchor="start" xml:space="preserve">[0.021, 0.003, -0.058, …]</text>
<text class="mono" x="316" y="222" text-anchor="start" xml:space="preserve">Kage_2018 · p. 2 · “are loade…”</text>
<text class="label" x="294" y="266" text-anchor="middle">… 203 points, one per chunk</text>
<rect x="640" y="40" width="196" height="60" rx="10" fill="#f1ebff" stroke="#7c5cd6" stroke-width="1.5"/>
<text class="title" x="738.0" y="66.0" text-anchor="middle">Question → vector</text>
<text class="sub" x="738.0" y="84.0" text-anchor="middle">embedded like the chunks</text>
<rect x="640" y="206" width="196" height="60" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="title" x="738.0" y="232.0" text-anchor="middle">5 closest points</text>
<text class="sub" x="738.0" y="250.0" text-anchor="middle">each with score + payload</text>
<path d="M640,70 L566,70" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="label" x="603" y="60" text-anchor="middle">query_points</text>
<path d="M566,236 L638,236" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="label" x="603" y="226" text-anchor="middle">returns</text>
<text class="label" x="96" y="316" text-anchor="start">vector = what Qdrant searches by</text>
<text class="label" x="316" y="316" text-anchor="start">payload = what you get back</text>
</svg>

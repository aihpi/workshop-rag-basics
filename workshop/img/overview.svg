<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 974 344" width="974" role="img" aria-label="The two halves of RAG. Ahead of time: PDFs go through Docling, are cut into chunks, embedded and stored in Qdrant. For every question: the question is embedded, the 5 closest chunks are found in Qdrant, put into a prompt with the question, and the LLM writes an answer with source links.">
<title>The two halves of RAG. Ahead of time: PDFs go through Docling, are cut into chunks, embedded and stored in Qdrant. For every question: the question is embedded, the 5 closest chunks are found in Qdrant, put into a prompt with the question, and the LLM writes an answer with source links.</title>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.title { font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; fill: #5f6b7a; }
.lane { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #5f6b7a; }
.label { font-size: 12px; fill: #5f6b7a; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="1" y="1" width="972" height="342" rx="14" fill="#ffffff" stroke="#e1e5ea"/>
<text class="lane" x="24" y="48" text-anchor="start">ONCE, AHEAD OF TIME</text>
<text class="lane" x="24" y="208" text-anchor="start">FOR EVERY QUESTION</text>
<rect x="24" y="66" width="136" height="58" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="title" x="92.0" y="91.0" text-anchor="middle">PDFs</text>
<text class="sub" x="92.0" y="109.0" text-anchor="middle">3 papers</text>
<rect x="182" y="66" width="136" height="58" rx="10" fill="#fff1e0" stroke="#d9822b" stroke-width="1.5"/>
<text class="title" x="250.0" y="91.0" text-anchor="middle">Docling</text>
<text class="sub" x="250.0" y="109.0" text-anchor="middle">PDF → Markdown</text>
<path d="M160,95.0 L180,95.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="66" width="136" height="58" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="title" x="408.0" y="91.0" text-anchor="middle">Chunks</text>
<text class="sub" x="408.0" y="109.0" text-anchor="middle">≈ 1000 characters</text>
<path d="M318,95.0 L338,95.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="498" y="66" width="136" height="58" rx="10" fill="#f1ebff" stroke="#7c5cd6" stroke-width="1.5"/>
<text class="title" x="566.0" y="91.0" text-anchor="middle">Embedding model</text>
<text class="sub" x="566.0" y="109.0" text-anchor="middle">text → 4096 numbers</text>
<path d="M476,95.0 L496,95.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="656" y="66" width="136" height="58" rx="10" fill="#e6f6ec" stroke="#2f9e62" stroke-width="1.5"/>
<text class="title" x="724.0" y="91.0" text-anchor="middle">Qdrant</text>
<text class="sub" x="724.0" y="109.0" text-anchor="middle">vectors + text + page</text>
<path d="M634,95.0 L654,95.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="24" y="226" width="136" height="58" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="title" x="92.0" y="251.0" text-anchor="middle">Question</text>
<text class="sub" x="92.0" y="269.0" text-anchor="middle">typed in the chat</text>
<rect x="182" y="226" width="136" height="58" rx="10" fill="#f1ebff" stroke="#7c5cd6" stroke-width="1.5"/>
<text class="title" x="250.0" y="251.0" text-anchor="middle">Embedding model</text>
<text class="sub" x="250.0" y="269.0" text-anchor="middle">same model</text>
<path d="M160,255.0 L180,255.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="226" width="136" height="58" rx="10" fill="#e6f6ec" stroke="#2f9e62" stroke-width="1.5"/>
<text class="title" x="408.0" y="251.0" text-anchor="middle">Search</text>
<text class="sub" x="408.0" y="269.0" text-anchor="middle">5 closest chunks</text>
<path d="M318,255.0 L338,255.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="498" y="226" width="136" height="58" rx="10" fill="#fff1e0" stroke="#d9822b" stroke-width="1.5"/>
<text class="title" x="566.0" y="251.0" text-anchor="middle">Prompt</text>
<text class="sub" x="566.0" y="269.0" text-anchor="middle">chunks + question</text>
<path d="M476,255.0 L496,255.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="656" y="226" width="136" height="58" rx="10" fill="#f1ebff" stroke="#7c5cd6" stroke-width="1.5"/>
<text class="title" x="724.0" y="251.0" text-anchor="middle">LLM</text>
<text class="sub" x="724.0" y="269.0" text-anchor="middle">gemma-4-31b</text>
<path d="M634,255.0 L654,255.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="814" y="226" width="136" height="58" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="title" x="882.0" y="251.0" text-anchor="middle">Answer</text>
<text class="sub" x="882.0" y="269.0" text-anchor="middle">with [1] [2] links</text>
<path d="M792,255.0 L812,255.0" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M724.0,124 L724.0,176 L408.0,176 L408.0,224" fill="none" stroke="#5f6b7a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="label" x="566.0" y="168" text-anchor="middle">searches the same collection</text>
<rect x="24" y="312" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
<text class="label" x="44" y="324" text-anchor="start">data</text>
<rect x="92" y="312" width="14" height="14" rx="3" fill="#fff1e0" stroke="#d9822b" stroke-width="1.5"/>
<text class="label" x="112" y="324" text-anchor="start">processing step</text>
<rect x="237" y="312" width="14" height="14" rx="3" fill="#f1ebff" stroke="#7c5cd6" stroke-width="1.5"/>
<text class="label" x="257" y="324" text-anchor="start">AI model</text>
<rect x="333" y="312" width="14" height="14" rx="3" fill="#e6f6ec" stroke="#2f9e62" stroke-width="1.5"/>
<text class="label" x="353" y="324" text-anchor="start">vector database</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 368" width="620" role="img" aria-label="Embeddings drawn as arrows. 'The cat sits on the mat' and 'A kitten is resting on a rug' point in almost the same direction (similarity 0.57); 'Quarterly revenue grew by four percent' points elsewhere (0.13).">
<title>Embeddings drawn as arrows. 'The cat sits on the mat' and 'A kitten is resting on a rug' point in almost the same direction (similarity 0.57); 'Quarterly revenue grew by four percent' points elsewhere (0.13).</title>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.title { font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; fill: #5f6b7a; }
.lane { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #5f6b7a; }
.label { font-size: 12px; fill: #5f6b7a; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="1" y="1" width="618" height="366" rx="14" fill="#ffffff" stroke="#e1e5ea"/>
<line x1="70" y1="300" x2="400" y2="300" stroke="#c5ccd3" stroke-width="1.5"/>
<line x1="70" y1="300" x2="70" y2="50" stroke="#c5ccd3" stroke-width="1.5"/>
<line x1="70" y1="300" x2="191.9" y2="104.9" stroke="#3b6fd8" stroke-width="2"/>
<circle cx="191.9" cy="104.9" r="5" fill="#3b6fd8"/>
<text class="label" x="201.88143077363713" y="108.94893788402203" text-anchor="start" style="fill:#1f2933">“The cat sits on the mat.”</text>
<line x1="70" y1="300" x2="229.8" y2="134.6" stroke="#3b6fd8" stroke-width="2"/>
<circle cx="229.8" cy="134.6" r="5" fill="#3b6fd8"/>
<text class="label" x="239.77142520556936" y="138.55184592211026" text-anchor="start" style="fill:#1f2933">“A kitten is resting on a rug.”</text>
<line x1="70" y1="300" x2="297.2" y2="264.0" stroke="#d9822b" stroke-width="2"/>
<circle cx="297.2" cy="264.0" r="5" fill="#d9822b"/>
<text class="label" x="307.1683183368817" y="268.0200730407469" text-anchor="start" style="fill:#1f2933">“Quarterly revenue grew by four percent.”</text>
<path d="M132.5,235.3 A90,90 0 0,0 117.7,223.7" fill="none" stroke="#5f6b7a" stroke-width="1.2"/>
<text class="title" x="88.71205217359835" y="215.96671593395752" text-anchor="middle">0.57</text>
<path d="M218.2,276.5 A150,150 0 0,0 149.5,172.8" fill="none" stroke="#5f6b7a" stroke-width="1.2"/>
<text class="title" x="213.42836139555294" y="209.066838526326" text-anchor="middle">0.13</text>
<text class="title" x="70" y="30" text-anchor="start">Similar meaning → arrows point the same way.</text>
<text class="label" x="70" y="330" text-anchor="start">Similarity = how closely two arrows point the same way (1 = same direction).</text>
<text class="label" x="70" y="348" text-anchor="start">Real embeddings have 4096 dimensions; this drawing has 2.</text>
</svg>
